<svg width="843.4" height="243.6" viewBox="0 0 843.4 243.6" xmlns="http://www.w3.org/2000/svg">
  <!-- untodo animated logo, extended cut:
       1) "// TODO:" is typed letter by letter with a blinking caret.
       2) Once typing finishes, the caret fades out and a strike-through
          line draws across the whole word.
       3) After a short hold, "// TODO:" (glyphs + strike line) fades out.
       4) "TODO()" fades in at the same center position, underlined with
          a red squiggly line (same motif as the favicon) instead of a
          straight strike — the comment is gone, the type-safe call stays.

       Implementation note: visibility/position are driven by native SVG
       <set>/<animate> elements (not CSS classes) so timing cannot be lost
       to CSS cascade/specificity issues (this bit us with long
       animation-delay + tiny animation-duration combinations in Chromium). -->

  <!-- ============ Act 1: "// TODO:" typed out ============ -->
  <g id="commentForm">
    <g fill="#F14E32">
      <path transform="translate(30.00,174.00) skewX(-6) scale(0.180000,-0.180000)" d="M30 -82H191L485 729H323Z" opacity="0">
        <set attributeName="opacity" to="1" begin="0.00s"/>
      </path>
      <path transform="translate(121.98,174.00) skewX(-6) scale(0.180000,-0.180000)" d="M30 -82H191L485 729H323Z" opacity="0">
        <set attributeName="opacity" to="1" begin="0.20s"/>
      </path>
      <path transform="translate(246.90,174.00) scale(0.180000,-0.180000)" d="M216 0H396V575H609V729H8V575H216Z" opacity="0">
        <set attributeName="opacity" to="1" begin="0.60s"/>
      </path>
      <path transform="translate(353.46,174.00) scale(0.180000,-0.180000)" d="M402 -10Q513 -10 596.5 34.0Q680 78 726.0 161.5Q772 245 772 365Q772 485 726.0 568.5Q680 652 596.5 695.5Q513 739 402 739Q292 739 208.5 695.5Q125 652 79.0 568.5Q33 485 33 365Q33 245 79.0 161.5Q125 78 208.5 34.0Q292 -10 402 -10ZM402 143Q319 143 268.0 196.5Q217 250 217 365Q217 479 268.0 532.5Q319 586 402 586Q486 586 537.0 532.0Q588 478 588 365Q588 251 537.0 197.0Q486 143 402 143Z" opacity="0">
        <set attributeName="opacity" to="1" begin="0.80s"/>
      </path>
      <path transform="translate(493.86,174.00) scale(0.180000,-0.180000)" d="M74 0H393Q503 0 578.5 46.0Q654 92 693.0 174.0Q732 256 732 364Q732 473 693.0 555.0Q654 637 578.5 683.0Q503 729 393 729H74ZM253 152V577H363Q417 577 459.0 559.0Q501 541 525.0 495.5Q549 450 549 368Q549 282 524.5 235.0Q500 188 458.0 170.0Q416 152 363 152Z" opacity="0">
        <set attributeName="opacity" to="1" begin="1.00s"/>
      </path>
      <path transform="translate(627.06,174.00) scale(0.180000,-0.180000)" d="M402 -10Q513 -10 596.5 34.0Q680 78 726.0 161.5Q772 245 772 365Q772 485 726.0 568.5Q680 652 596.5 695.5Q513 739 402 739Q292 739 208.5 695.5Q125 652 79.0 568.5Q33 485 33 365Q33 245 79.0 161.5Q125 78 208.5 34.0Q292 -10 402 -10ZM402 143Q319 143 268.0 196.5Q217 250 217 365Q217 479 268.0 532.5Q319 586 402 586Q486 586 537.0 532.0Q588 478 588 365Q588 251 537.0 197.0Q486 143 402 143Z" opacity="0">
        <set attributeName="opacity" to="1" begin="1.20s"/>
      </path>
      <path transform="translate(767.46,174.00) scale(0.180000,-0.180000)" d="M48 391H207V540H48ZM48 0H207V149H48Z" opacity="0">
        <set attributeName="opacity" to="1" begin="1.40s"/>
      </path>
    </g>

    <!-- caret: blinks continuously, jumps to each new position right after
         the glyph at that position appears, then fades out once typing is done -->
    <rect x="0" y="44" width="10" height="160" rx="3" fill="#4E443C" opacity="0">
      <set attributeName="opacity" to="1" begin="0s"/>
      <animate attributeName="opacity"
        values="1;1;0;0" keyTimes="0;0.49;0.5;1"
        dur="0.5s" begin="0s" repeatCount="indefinite"/>
      <set attributeName="opacity" to="0" begin="1.45s"/>

      <animate attributeName="x"
        keyTimes="0;0;0.124375;0.125000;0.249375;0.250000;0.374375;0.375000;0.499375;0.500000;0.624375;0.625000;0.749375;0.750000;0.874375;0.875000;1"
        values="0;121.98;121.98;213.96;213.96;246.90;246.90;353.46;353.46;493.86;493.86;627.06;627.06;767.46;767.46;808.86;808.86"
        dur="1.6s" fill="freeze"
        calcMode="discrete"/>
    </rect>

    <!-- strike-through line: draws once the caret is gone -->
    <line x1="6" y1="116.4" x2="837.4" y2="116.4"
          stroke="#9A9994" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="832" stroke-dashoffset="832">
      <animate attributeName="stroke-dashoffset" from="832" to="0"
        dur="0.6s" begin="1.6s" fill="freeze"
        calcMode="spline" keySplines="0.65 0 0.35 1" keyTimes="0;1" values="832;0"/>
    </line>

    <!-- after a short hold (struck-through state visible 1.6s -> 2.5s),
         the whole comment form fades out as a group -->
    <animate attributeName="opacity" from="1" to="0"
      dur="0.45s" begin="2.5s" fill="freeze"/>
  </g>

  <!-- ============ Act 2: "TODO()" call form fades in, underlined with a
       red squiggle (same motif as the favicon) ============ -->
  <g id="callForm" opacity="0">
    <set attributeName="opacity" to="0" begin="0s"/>
    <animate attributeName="opacity" from="0" to="1"
      dur="0.45s" begin="2.75s" fill="freeze"/>

    <g fill="#F14E32">
      <path transform="translate(92.93,174.00) scale(0.180000,-0.180000)" d="M216 0H396V575H609V729H8V575H216Z"/>
      <path transform="translate(199.49,174.00) scale(0.180000,-0.180000)" d="M402 -10Q513 -10 596.5 34.0Q680 78 726.0 161.5Q772 245 772 365Q772 485 726.0 568.5Q680 652 596.5 695.5Q513 739 402 739Q292 739 208.5 695.5Q125 652 79.0 568.5Q33 485 33 365Q33 245 79.0 161.5Q125 78 208.5 34.0Q292 -10 402 -10ZM402 143Q319 143 268.0 196.5Q217 250 217 365Q217 479 268.0 532.5Q319 586 402 586Q486 586 537.0 532.0Q588 478 588 365Q588 251 537.0 197.0Q486 143 402 143Z"/>
      <path transform="translate(339.89,174.00) scale(0.180000,-0.180000)" d="M74 0H393Q503 0 578.5 46.0Q654 92 693.0 174.0Q732 256 732 364Q732 473 693.0 555.0Q654 637 578.5 683.0Q503 729 393 729H74ZM253 152V577H363Q417 577 459.0 559.0Q501 541 525.0 495.5Q549 450 549 368Q549 282 524.5 235.0Q500 188 458.0 170.0Q416 152 363 152Z"/>
      <path transform="translate(473.09,174.00) scale(0.180000,-0.180000)" d="M402 -10Q513 -10 596.5 34.0Q680 78 726.0 161.5Q772 245 772 365Q772 485 726.0 568.5Q680 652 596.5 695.5Q513 739 402 739Q292 739 208.5 695.5Q125 652 79.0 568.5Q33 485 33 365Q33 245 79.0 161.5Q125 78 208.5 34.0Q292 -10 402 -10ZM402 143Q319 143 268.0 196.5Q217 250 217 365Q217 479 268.0 532.5Q319 586 402 586Q486 586 537.0 532.0Q588 478 588 365Q588 251 537.0 197.0Q486 143 402 143Z"/>
      <path transform="translate(613.49,174.00) scale(0.180000,-0.180000)" d="M219 -167H363Q316 -113 280.5 -36.0Q245 41 225.5 131.0Q206 221 206 313Q206 405 225.5 494.5Q245 584 280.5 661.5Q316 739 363 793H219Q165 741 125.0 663.5Q85 586 63.5 495.5Q42 405 42 313Q42 221 63.5 130.5Q85 40 125.0 -37.0Q165 -114 219 -167Z"/>
      <path transform="translate(679.73,174.00) scale(0.180000,-0.180000)" d="M174.0 793.0H30.0Q77.0 739.0 112.5 662.0Q148.0 585.0 167.5 495.0Q187.0 405.0 187.0 313.0Q187.0 221.0 167.5 131.5Q148.0 42.0 112.5 -35.5Q77.0 -113.0 30.0 -167.0H174.0Q228.0 -115.0 268.0 -37.5Q308.0 40.0 329.5 130.5Q351.0 221.0 351.0 313.0Q351.0 405.0 329.5 495.5Q308.0 586.0 268.0 663.0Q228.0 740.0 174.0 793.0Z"/>
    </g>

    <!-- squiggly underline, same motif as the favicon, scaled to "TODO()"'s width -->
    <path transform="translate(92.93,210)"
          d="M 0,0 Q 13.70,18.31 27.40,0 Q 41.10,-18.31 54.79,0 Q 68.49,18.31 82.19,0 Q 95.89,-18.31 109.59,0 Q 123.29,18.31 136.99,0 Q 150.69,-18.31 164.38,0 Q 178.08,18.31 191.78,0 Q 205.48,-18.31 219.18,0 Q 232.88,18.31 246.58,0 Q 260.28,-18.31 273.98,0 Q 287.67,18.31 301.37,0 Q 315.07,-18.31 328.77,0 Q 342.47,18.31 356.17,0 Q 369.87,-18.31 383.56,0 Q 397.26,18.31 410.96,0 Q 424.66,-18.31 438.36,0 Q 452.06,18.31 465.76,0 Q 479.46,-18.31 493.15,0 Q 506.85,18.31 520.55,0 Q 534.25,-18.31 547.95,0 Q 561.65,18.31 575.35,0 Q 589.05,-18.31 602.75,0 Q 616.44,18.31 630.14,0 Q 643.84,-18.31 657.54,0"
          fill="none" stroke="#E8412C" stroke-width="9" stroke-linecap="round"/>
  </g>

  <style>
    @media (prefers-reduced-motion: reduce) {
      svg * { animation: none !important; }
    }
  </style>
</svg>
